<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>Refer & Earn - GlamGrid</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        :root {
            --bg-primary: #0f0f12;
            --bg-card: #1f1f26;
            --pink-accent: #ff4d8d;
            --gradient-pink: linear-gradient(135deg, #d81b60, #ff4d8d);
            --text-primary: #ffffff;
            --text-secondary: #aaaaaa;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            padding: 20px;
        }

        .app-container { max-width: 480px; margin: 0 auto; }

        .earnings-card {
            background: var(--gradient-pink);
            border-radius: 24px;
            padding: 30px;
            text-align: center;
            margin-bottom: 24px;
            box-shadow: 0 10px 40px rgba(216,27,96,0.3);
        }

        .earnings-amount { font-size: 42px; font-weight: 800; margin: 10px 0; }

        .referral-link-box {
            background: var(--bg-card);
            border-radius: 16px;
            padding: 16px;
            margin: 20px 0;
            display: flex;
            align-items: center;
            gap: 10px;
            border: 1px solid rgba(255,255,255,0.1);
        }

        .referral-link {
            flex: 1;
            background: none;
            border: none;
            color: var(--text-secondary);
            font-size: 14px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .copy-btn {
            background: var(--pink-accent);
            border: none;
            padding: 10px 16px;
            border-radius: 12px;
            color: white;
            cursor: pointer;
            font-weight: 600;
        }

        .share-buttons {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-top: 20px;
        }

        .share-btn {
            padding: 14px;
            border-radius: 16px;
            border: none;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            font-size: 14px;
        }

        .whatsapp-btn { background: #25D366; color: white; }
        .copy-link-btn { background: var(--bg-card); color: white; border: 1px solid rgba(255,255,255,0.1); }
    </style>
</head>
<body>
    <div class="app-container">
        <h1 style="margin-bottom: 24px;">Refer & Earn 💰</h1>

        <div class="earnings-card">
            <div style="font-size:14px; opacity:0.9;">Total Earnings</div>
            <div class="earnings-amount" id="totalEarnings">₹0</div>
            <div style="font-size:12px; opacity:0.8;">From <span id="referralCount">0</span> referrals</div>
        </div>

        <h3 style="margin-bottom:12px;">Your Referral Link</h3>
        <div class="referral-link-box">
            <input type="text" class="referral-link" id="referralLink" readonly>
            <button class="copy-btn" onclick="copyLink()"><i class="fas fa-copy"></i> Copy</button>
        </div>

        <div class="share-buttons">
            <button class="share-btn whatsapp-btn" onclick="shareWhatsApp()">
                <i class="fab fa-whatsapp"></i> WhatsApp
            </button>
            <button class="share-btn copy-link-btn" onclick="copyLink()">
                <i class="fas fa-link"></i> Copy Link
            </button>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="config.js"></script>
    <script>
        async function loadReferralData() {
            const user = await getCurrentUser();
            if (!user) {
                window.location.href = 'login.html';
                return;
            }

            try {
                const profile = await fetchUserProfile(user.id);
                if (profile) {
                    const referralLink = `${window.location.origin}/?ref=${profile.referral_code}`;
                    document.getElementById('referralLink').value = referralLink;
                    document.getElementById('totalEarnings').textContent = formatPrice(profile.total_earnings || 0);
                    document.getElementById('referralCount').textContent = profile.referrals?.length || 0;
                }
            } catch (error) {
                console.log('Using demo data');
                document.getElementById('referralLink').value = `${window.location.origin}/?ref=DEMO123`;
            }
        }

        window.copyLink = function() {
            const linkInput = document.getElementById('referralLink');
            linkInput.select();
            document.execCommand('copy');
            showToast('Link copied!');
        };

        window.shareWhatsApp = function() {
            const link = document.getElementById('referralLink').value;
            const text = `🛍️ Shop on GlamGrid and get amazing discounts!\nUse my referral link: ${link}`;
            window.open(`https://wa.me/?text=${encodeURIComponent(text)}`, '_blank');
        };

        loadReferralData();
    </script>
</body>
</html>
