<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel - GlamGrid</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        :root {
            --bg-primary: #0f0f12;
            --bg-card: #1f1f26;
            --pink-accent: #ff4d8d;
            --gradient-pink: linear-gradient(135deg, #d81b60, #ff4d8d);
            --text-primary: #ffffff;
            --text-secondary: #aaaaaa;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            display: flex;
            min-height: 100vh;
        }

        .sidebar {
            width: 250px;
            background: var(--bg-card);
            padding: 30px 20px;
            border-right: 1px solid rgba(255,255,255,0.05);
        }

        .sidebar-logo {
            font-size: 24px;
            font-weight: 800;
            margin-bottom: 40px;
            background: var(--gradient-pink);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .sidebar-menu { list-style: none; }

        .sidebar-menu li {
            padding: 14px 16px;
            margin-bottom: 8px;
            border-radius: 12px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 12px;
            transition: all 0.3s;
        }

        .sidebar-menu li:hover,
        .sidebar-menu li.active {
            background: rgba(216,27,96,0.1);
            color: var(--pink-accent);
        }

        .main-content { flex: 1; padding: 30px; overflow-y: auto; }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: var(--bg-card);
            border-radius: 20px;
            padding: 24px;
            border: 1px solid rgba(255,255,255,0.05);
        }

        .stat-value { font-size: 32px; font-weight: 700; color: var(--pink-accent); }
        .stat-label { color: var(--text-secondary); font-size: 14px; margin-top: 4px; }

        .data-table {
            width: 100%;
            background: var(--bg-card);
            border-radius: 20px;
            padding: 20px;
        }

        table { width: 100%; border-collapse: collapse; }

        th {
            text-align: left;
            padding: 12px;
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }

        td { padding: 12px; }
    </style>
</head>
<body>
    <div class="sidebar">
        <div class="sidebar-logo">GlamGrid Admin</div>
        <ul class="sidebar-menu">
            <li class="active"><i class="fas fa-chart-bar"></i> Dashboard</li>
            <li onclick="window.location.href='admin-products.html'"><i class="fas fa-box"></i> Products</li>
            <li onclick="window.location.href='admin-orders.html'"><i class="fas fa-shopping-cart"></i> Orders</li>
            <li><i class="fas fa-users"></i> Users</li>
        </ul>
    </div>

    <div class="main-content">
        <h1 style="margin-bottom:30px;">Dashboard Overview</h1>
        
        <div class="stats-grid">
            <div class="stat-card">
                <div class="stat-value" id="totalRevenue">₹0</div>
                <div class="stat-label">Total Revenue</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="totalOrders">0</div>
                <div class="stat-label">Total Orders</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="pendingOrders">0</div>
                <div class="stat-label">Pending Orders</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="totalUsers">0</div>
                <div class="stat-label">Total Users</div>
            </div>
        </div>

        <h2 style="margin:30px 0 20px;">Recent Orders</h2>
        <div class="data-table">
            <table>
                <thead>
                    <tr>
                        <th>Order ID</th>
                        <th>Customer</th>
                        <th>Amount</th>
                        <th>Status</th>
                    </tr>
                </thead>
                <tbody id="recentOrders"></tbody>
            </table>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="config.js"></script>
    <script>
        async function loadDashboard() {
            try {
                const orders = await fetchAllOrders();
                const users = await fetchAllUsers();
                
                const totalRevenue = orders.reduce((sum, o) => sum + (o.total_amount || 0), 0);
                const pendingCount = orders.filter(o => o.status === 'pending').length;
                
                document.getElementById('totalRevenue').textContent = formatPrice(totalRevenue);
                document.getElementById('totalOrders').textContent = orders.length;
                document.getElementById('pendingOrders').textContent = pendingCount;
                document.getElementById('totalUsers').textContent = users.length;

                const recentOrdersHTML = orders.slice(0, 5).map(order => `
                    <tr>
                        <td>#${order.id.substring(0, 8)}</td>
                        <td>${order.address?.fullName || 'N/A'}</td>
                        <td>${formatPrice(order.total_amount)}</td>
                        <td><span style="background:rgba(76,175,80,0.2); color:#4CAF50; padding:4px 12px; border-radius:20px;">${order.status}</span></td>
                    </tr>
                `).join('');
                
                document.getElementById('recentOrders').innerHTML = recentOrdersHTML;
            } catch (error) {
                console.error('Dashboard error:', error);
            }
        }

        loadDashboard();
    </script>
</body>
</html>
