<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>Cart - GlamGrid</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        :root {
            --bg-primary: #0f0f12;
            --bg-card: #1f1f26;
            --pink-accent: #ff4d8d;
            --gradient-pink: linear-gradient(135deg, #d81b60, #ff4d8d);
            --text-primary: #ffffff;
            --text-secondary: #aaaaaa;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            padding-bottom: 120px;
        }

        .app-container { max-width: 480px; margin: 0 auto; padding: 20px; }

        .header {
            display: flex;
            align-items: center;
            gap: 16px;
            margin-bottom: 24px;
        }

        .back-btn {
            background: none;
            border: none;
            color: white;
            font-size: 20px;
            cursor: pointer;
        }

        .page-title { font-size: 24px; font-weight: 700; }

        .cart-item {
            background: var(--bg-card);
            border-radius: 20px;
            padding: 16px;
            margin-bottom: 16px;
            display: flex;
            gap: 16px;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .cart-item-image {
            width: 100px;
            height: 120px;
            border-radius: 12px;
            object-fit: cover;
        }

        .cart-item-details { flex: 1; }
        .cart-item-name { font-weight: 600; font-size: 15px; margin-bottom: 8px; }
        .cart-item-price { color: var(--pink-accent); font-weight: 700; font-size: 18px; margin-bottom: 8px; }
        .cart-item-size { color: var(--text-secondary); font-size: 13px; margin-bottom: 12px; }

        .quantity-controls { display: flex; align-items: center; gap: 12px; }

        .qty-btn {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            border: 1px solid rgba(255, 255, 255, 0.2);
            background: transparent;
            color: white;
            cursor: pointer;
            font-size: 16px;
        }

        .qty-count { font-weight: 600; font-size: 16px; }

        .remove-btn {
            background: none;
            border: none;
            color: #ff4444;
            cursor: pointer;
            font-size: 13px;
            margin-top: 8px;
        }

        .cart-summary {
            position: fixed;
            bottom: 16px;
            left: 50%;
            transform: translateX(-50%);
            width: calc(100% - 32px);
            max-width: 448px;
            background: var(--bg-card);
            border-radius: 20px;
            padding: 20px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
        }

        .summary-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 12px;
            font-size: 14px;
        }

        .summary-total { font-weight: 700; font-size: 18px; color: var(--pink-accent); }

        .checkout-btn {
            width: 100%;
            padding: 16px;
            background: var(--gradient-pink);
            border: none;
            border-radius: 50px;
            color: white;
            font-weight: 700;
            font-size: 16px;
            cursor: pointer;
            margin-top: 12px;
            box-shadow: 0 8px 25px rgba(216, 27, 96, 0.3);
        }

        .empty-cart { text-align: center; padding: 60px 20px; }
        .empty-cart i { font-size: 64px; color: #666; margin-bottom: 20px; }
    </style>
</head>
<body>
    <div class="app-container">
        <div class="header">
            <button class="back-btn" onclick="history.back()"><i class="fas fa-arrow-left"></i></button>
            <h1 class="page-title">My Cart</h1>
        </div>

        <div id="cartItems"></div>

        <div id="emptyCart" class="empty-cart" style="display:none;">
            <i class="fas fa-shopping-bag"></i>
            <h2>Your cart is empty</h2>
            <p style="color: #666;">Add items to get started</p>
            <button class="checkout-btn" style="margin-top: 24px;" onclick="window.location.href='index.html'">Continue Shopping</button>
        </div>

        <div class="cart-summary" id="cartSummary" style="display:none;">
            <div class="summary-row"><span>Subtotal</span><span id="subtotal">₹0</span></div>
            <div class="summary-row"><span>Delivery</span><span style="color: #4CAF50;">FREE</span></div>
            <div class="summary-row summary-total"><span>Total</span><span id="total">₹0</span></div>
            <button class="checkout-btn" onclick="proceedToCheckout()">Proceed to Checkout</button>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="config.js"></script>
    <script>
        let cart = getCart();

        function renderCart() {
            const cartItemsDiv = document.getElementById('cartItems');
            const emptyCartDiv = document.getElementById('emptyCart');
            const cartSummaryDiv = document.getElementById('cartSummary');

            if (cart.length === 0) {
                cartItemsDiv.innerHTML = '';
                emptyCartDiv.style.display = 'block';
                cartSummaryDiv.style.display = 'none';
                return;
            }

            emptyCartDiv.style.display = 'none';
            cartSummaryDiv.style.display = 'block';

            cartItemsDiv.innerHTML = cart.map((item, index) => `
                <div class="cart-item">
                    <img src="${item.image || 'https://images.unsplash.com/photo-1617627143750-d86bc21e42bb?w=200'}" 
                         alt="${item.name}" class="cart-item-image">
                    <div class="cart-item-details">
                        <div class="cart-item-name">${item.name}</div>
                        <div class="cart-item-price">${formatPrice(item.price)}</div>
                        <div class="cart-item-size">Size: ${item.size}</div>
                        <div class="quantity-controls">
                            <button class="qty-btn" onclick="updateQuantity(${index}, -1)">-</button>
                            <span class="qty-count">${item.quantity}</span>
                            <button class="qty-btn" onclick="updateQuantity(${index}, 1)">+</button>
                        </div>
                        <button class="remove-btn" onclick="removeItem(${index})"><i class="fas fa-trash"></i> Remove</button>
                    </div>
                </div>
            `).join('');

            updateSummary();
        }

        function updateQuantity(index, change) {
            cart[index].quantity += change;
            if (cart[index].quantity <= 0) cart.splice(index, 1);
            saveCart(cart);
            cart = getCart();
            renderCart();
        }

        function removeItem(index) {
            cart.splice(index, 1);
            saveCart(cart);
            cart = getCart();
            renderCart();
        }

        function updateSummary() {
            const subtotal = cart.reduce((sum, item) => sum + (item.price * item.quantity), 0);
            document.getElementById('subtotal').textContent = formatPrice(subtotal);
            document.getElementById('total').textContent = formatPrice(subtotal);
        }

        async function proceedToCheckout() {
            const user = await getCurrentUser();
            if (!user) {
                window.location.href = 'login.html?redirect=checkout.html';
                return;
            }
            window.location.href = 'checkout.html';
        }

        window.updateQuantity = updateQuantity;
        window.removeItem = removeItem;
        window.proceedToCheckout = proceedToCheckout;

        renderCart();
    </script>
</body>
</html>
