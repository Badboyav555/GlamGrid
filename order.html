<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>My Orders - GlamGrid</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        :root {
            --bg-primary: #0f0f12;
            --bg-card: #1f1f26;
            --pink-accent: #ff4d8d;
            --text-primary: #ffffff;
            --text-secondary: #aaaaaa;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            padding-bottom: 100px;
        }

        .app-container { max-width: 480px; margin: 0 auto; padding: 20px; }

        .header { margin-bottom: 24px; }
        .page-title { font-size: 24px; font-weight: 700; }

        .order-card {
            background: var(--bg-card);
            border-radius: 20px;
            padding: 20px;
            margin-bottom: 16px;
            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        .order-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
        }

        .order-status {
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 700;
            text-transform: uppercase;
        }

        .status-pending { background: rgba(255,193,7,0.2); color: #FFC107; }
        .status-confirmed { background: rgba(33,150,243,0.2); color: #2196F3; }
        .status-shipped { background: rgba(156,39,176,0.2); color: #9C27B0; }
        .status-delivered { background: rgba(76,175,80,0.2); color: #4CAF50; }
        .status-cancelled { background: rgba(244,67,54,0.2); color: #F44336; }

        .timeline {
            position: relative;
            padding-left: 30px;
            margin-top: 16px;
        }

        .timeline::before {
            content: '';
            position: absolute;
            left: 8px;
            top: 0;
            bottom: 0;
            width: 2px;
            background: rgba(255,255,255,0.1);
        }

        .timeline-item {
            position: relative;
            margin-bottom: 20px;
            padding-left: 10px;
        }

        .timeline-dot {
            position: absolute;
            left: -26px;
            top: 0;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: var(--text-secondary);
            border: 2px solid var(--bg-card);
        }

        .timeline-dot.active {
            background: var(--pink-accent);
            box-shadow: 0 0 10px rgba(216,27,96,0.5);
        }

        .timeline-text { font-size: 14px; color: var(--text-secondary); }
        .timeline-date { font-size: 12px; color: #666; margin-top: 4px; }

        .order-item-row {
            display: flex;
            gap: 12px;
            padding: 8px 0;
        }

        .order-item-img {
            width: 50px;
            height: 60px;
            border-radius: 8px;
            object-fit: cover;
        }
    </style>
</head>
<body>
    <div class="app-container">
        <div class="header">
            <h1 class="page-title">My Orders</h1>
        </div>
        <div id="ordersList"></div>
        <div id="emptyOrders" style="text-align:center; padding:60px 20px; display:none;">
            <i class="fas fa-box-open" style="font-size:64px; color:#666; margin-bottom:20px;"></i>
            <h2>No orders yet</h2>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="config.js"></script>
    <script>
        async function loadOrders() {
            const user = await getCurrentUser();
            if (!user) {
                window.location.href = 'login.html';
                return;
            }

            try {
                const orders = await fetchOrders(user.id);
                renderOrders(orders);
            } catch (error) {
                renderOrders([]);
            }
        }

        function renderOrders(orders) {
            const ordersList = document.getElementById('ordersList');
            const emptyOrders = document.getElementById('emptyOrders');

            if (!orders || orders.length === 0) {
                ordersList.innerHTML = '';
                emptyOrders.style.display = 'block';
                return;
            }

            emptyOrders.style.display = 'none';
            ordersList.innerHTML = orders.map(order => createOrderCard(order)).join('');
        }

        function createOrderCard(order) {
            const statusClass = `status-${order.status}`;
            const timeline = getTimeline(order.status);

            return `
                <div class="order-card">
                    <div class="order-header">
                        <span>Order #${order.id.substring(0, 8)}</span>
                        <span class="order-status ${statusClass}">${order.status}</span>
                    </div>
                    
                    <div>
                        ${order.items.map(item => `
                            <div class="order-item-row">
                                <img src="${item.image || 'https://images.unsplash.com/photo-1617627143750-d86bc21e42bb?w=100'}" 
                                     alt="${item.name}" class="order-item-img">
                                <div>
                                    <div style="font-weight:600;">${item.name}</div>
                                    <div style="color:#666; font-size:13px;">Qty: ${item.quantity}</div>
                                    <div style="color: var(--pink-accent); font-weight:600;">${formatPrice(item.price * item.quantity)}</div>
                                </div>
                            </div>
                        `).join('')}
                    </div>

                    <div class="timeline">
                        ${timeline.map(t => `
                            <div class="timeline-item">
                                <div class="timeline-dot ${t.active ? 'active' : ''}"></div>
                                <div class="timeline-text">${t.label}</div>
                                <div class="timeline-date">${t.date}</div>
                            </div>
                        `).join('')}
                    </div>

                    <div style="margin-top:16px; padding-top:16px; border-top:1px solid rgba(255,255,255,0.05); display:flex; justify-content:space-between;">
                        <span>Total</span>
                        <span style="color:var(--pink-accent); font-weight:700;">${formatPrice(order.total_amount)}</span>
                    </div>
                </div>
            `;
        }

        function getTimeline(status) {
            const timelines = {
                pending: [
                    { label: 'Order Placed', active: true, date: 'Just now' },
                    { label: 'Confirmed', active: false, date: 'Pending' },
                    { label: 'Shipped', active: false, date: 'Pending' },
                    { label: 'Delivered', active: false, date: 'Pending' }
                ],
                confirmed: [
                    { label: 'Order Placed', active: true, date: 'Completed' },
                    { label: 'Confirmed', active: true, date: 'Just now' },
                    { label: 'Shipped', active: false, date: 'Pending' },
                    { label: 'Delivered', active: false, date: 'Pending' }
                ],
                shipped: [
                    { label: 'Order Placed', active: true, date: 'Completed' },
                    { label: 'Confirmed', active: true, date: 'Completed' },
                    { label: 'Shipped', active: true, date: 'In transit' },
                    { label: 'Delivered', active: false, date: 'Expected soon' }
                ],
                delivered: [
                    { label: 'Order Placed', active: true, date: 'Completed' },
                    { label: 'Confirmed', active: true, date: 'Completed' },
                    { label: 'Shipped', active: true, date: 'Completed' },
                    { label: 'Delivered', active: true, date: 'Delivered' }
                ]
            };
            return timelines[status] || timelines.pending;
        }

        loadOrders();
    </script>
</body>
</html>
