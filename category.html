<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>Categories - GlamGrid</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        :root {
            --bg-primary: #0f0f12;
            --bg-card: #1f1f26;
            --pink-accent: #ff4d8d;
            --text-primary: #ffffff;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            padding: 20px;
        }

        .app-container { max-width: 480px; margin: 0 auto; }

        .product-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
        }

        .product-card {
            background: var(--bg-card);
            border-radius: 16px;
            overflow: hidden;
            cursor: pointer;
        }

        .product-image { width: 100%; height: 200px; object-fit: cover; }
        .product-info { padding: 12px; }
        .product-name { font-weight: 600; }
        .product-price { color: var(--pink-accent); font-weight: 700; margin-top: 4px; }
    </style>
</head>
<body>
    <div class="app-container">
        <h1 style="margin-bottom: 24px;">All Products</h1>
        <div class="product-grid" id="categoryGrid"></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="config.js"></script>
    <script>
        async function loadAllProducts() {
            const urlParams = new URLSearchParams(window.location.search);
            const type = urlParams.get('type');
            
            let products = await fetchProducts();
            
            const grid = document.getElementById('categoryGrid');
            grid.innerHTML = products.map(p => `
                <div class="product-card" onclick="window.location.href='product.html?id=${p.id}'">
                    <img src="${p.images?.[0] || 'https://images.unsplash.com/photo-1617627143750-d86bc21e42bb?w=400'}" 
                         alt="${p.name}" class="product-image">
                    <div class="product-info">
                        <div class="product-name">${p.name}</div>
                        <div class="product-price">${formatPrice(p.discounted_price)}</div>
                    </div>
                </div>
            `).join('');
        }

        loadAllProducts();
    </script>
</body>
</html>
